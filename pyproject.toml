[project]
name = "drytrix-timetracker-mcp"
version = "0.1.0"
description = "MCP server for DRYTRIX/TimeTracker (REST API v1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
drytrix-timetracker-mcp = "drytrix_timetracker_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drytrix_timetracker_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
